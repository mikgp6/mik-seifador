<div id="app">

  <header id="topo-compacto">
    <div class="cp-mus">
      <button type="button" class="b3d ic" data-cmd="mprev" title="Música anterior" aria-label="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
      <div class="cp-titulos">
        <b id="cp-musica">Nenhuma música</b>
        <small id="cp-secao">—</small>
      </div>
      <button type="button" class="b3d ic" data-cmd="mnext" title="Próxima música" aria-label="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5l10.5 7L4 19z"/></svg></button>
    </div>
    <div class="cp-meta">
      <span class="cp-dado"><small>TEMPO</small><b id="cp-tempo">0:00 / 0:00</b></span>
      <span class="cp-dado"><small>BPM</small><b id="cp-bpm">--</b></span>
      <button type="button" class="cp-dado cp-tom" id="cp-bt-tom"><small>TOM</small><b id="cp-tom">--</b></button>
      <span class="cp-status"><i id="cp-dot"></i><span id="cp-txt">Conectando ao REAPER…</span></span>
    </div>
  </header>
  <header id="topo">
    <div class="grupo transporte">
      <button class="b3d ic" data-cmd="mprev" title="Música anterior"><svg viewBox="0 0 24 24"><path d="M6 5h2.4v14H6zM20 5v14L9.5 12z"/></svg></button>
      <button id="bt-play" class="play3d" data-cmd="play" title="Play / Pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg></button>
      <button class="b3d ic" data-cmd="mnext" title="Próxima música"><svg viewBox="0 0 24 24"><path d="M15.6 5H18v14h-2.4zM4 5l10.5 7L4 19z"/></svg></button>
      <button class="b3d ic" data-cmd="stop" title="Stop"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    </div>
    <div class="grupo secnav">
      <button class="b3d rot" data-cmd="sprev"><svg viewBox="0 0 24 24"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></svg><span>SEÇÃO</span></button>
      <button class="b3d rot" data-cmd="snext"><svg viewBox="0 0 24 24"><path d="M13 6v12l8-6zM4 6v12l8-6z"/></svg><span>SEÇÃO</span></button>
    </div>
    <div class="grupo flags">
      <button class="b3d rot" data-cmd="auto" data-flag="AUTO"><svg viewBox="0 0 24 24"><path d="M12 4l7 16h-3l-1.6-4H9.6L8 20H5zm-1.3 9h2.6L12 9.6z"/></svg><span>AUTO</span></button>
      <button class="b3d rot" data-cmd="hold" data-flag="HOLD"><svg viewBox="0 0 24 24"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg><span>HOLD</span></button>
      <button class="b3d rot" data-cmd="loop" data-flag="LOOP"><svg viewBox="0 0 24 24"><path d="M17 7h-9a5 5 0 0 0 0 10h1v-2.4H8a2.6 2.6 0 0 1 0-5.2h9V12l4-3.6L17 5zM16 14.6v2.4h-1v-2.4z"/><path d="M15 14.6h1a2.6 2.6 0 0 0 2.4-1.6l2.2 1A5 5 0 0 1 16 17h-1z"/></svg><span>LOOP</span></button>
    </div>
    <div id="lcd" class="lcd">
      <div class="lcd-cols">
        <div><b id="lcd-tempo">0:00 / 0:00</b><small>TEMPO</small></div>
        <div><b id="lcd-bpm">--</b><small>BPM</small></div>
        <div><b id="lcd-tom">--</b><small>TOM</small></div>
      </div>
      <div class="lcd-status"><i id="lcd-dot"></i><span id="lcd-txt">Conectando ao REAPER…</span></div>
    </div>
    <div class="grupo modos">
      <button class="b3d rot" data-cmd="lr" data-modo="LR"><svg viewBox="0 0 24 24"><circle cx="7" cy="12" r="4.5"/><circle cx="17" cy="12" r="4.5"/></svg><span>L/R</span></button>
      <button class="b3d rot" data-cmd="aovivo" data-modo="AO_VIVO"><svg viewBox="0 0 24 24"><path d="M12 3a4 4 0 0 1 4 4v4a4 4 0 0 1-8 0V7a4 4 0 0 1 4-4zM5 11h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11z"/></svg><span>Ao Vivo</span></button>
      <button class="b3d rot" data-cmd="studio" data-modo="STUDIO"><svg viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8v6a3 3 0 0 0 3 3h2v-8H6v-1a6 6 0 0 1 12 0v1h-3v8h2a3 3 0 0 0 3-3v-6a8 8 0 0 0-8-8z"/></svg><span>Studio</span></button>
      <button class="b3d rot tom" id="bt-tom"><b id="tom-val">--</b><span id="tom-rot">Tom</span></button>
      <button class="b3d rot" id="bt-menu"><svg viewBox="0 0 24 24"><path d="M4 6h16v2.4H4zM4 10.8h16v2.4H4zM4 15.6h16V18H4z"/></svg><span>Menu</span></button>
    </div>
  </header>

  <div id="prog" hidden>
    <div class="prog-barra"><i id="prog-fill"></i></div>
    <div class="prog-txt"><span id="prog-linha"></span><span id="prog-sub"></span><button id="prog-cancelar" class="lnk" hidden>Cancelar</button></div>
  </div>


  <div id="chips-compacto">
    <div class="cp-flags">
      <button type="button" class="chip" data-cmd="auto" data-flag="AUTO">AUTO</button>
      <button type="button" class="chip" data-cmd="hold" data-flag="HOLD">HOLD</button>
      <button type="button" class="chip" data-cmd="loop" data-flag="LOOP">LOOP</button>
      <button type="button" class="chip liga-pad" data-cmd="pad" data-flag="PAD" id="bt-pad-cp">PAD</button>
    </div>
    <div class="cp-acoes">
      <button type="button" class="chip" id="bt-setlist-cp">Setlist</button>
      <button type="button" class="chip" id="bt-menu-cp">Menu</button>
      <button type="button" class="chip" id="bt-ver-completo">Ver completo</button>
    </div>
  </div>

  <div id="seek-fino" role="slider" aria-label="Posição da música" aria-valuemin="0" aria-valuemax="100">
    <div id="seek-marcas"></div>
    <div id="seek-trilha"><i id="seek-fill"></i><b id="seek-cursor"></b></div>
  </div>

  <section id="setlist" class="faixa"></section>
  <div id="setlist-ph" hidden></div>

  <section id="onda-box">
    <canvas id="onda"></canvas>
  </section>

  <div id="palco">
  <section id="secoes"></section>

  <section id="info">
    <div class="caixa bpm"><small>BPM</small><b id="bpm-val">--</b>
      <button class="chip mini" data-cmd="bpm" data-arg="-1">−</button><button class="chip mini" data-cmd="bpm" data-arg="1">+</button><button class="chip mini" data-cmd="bpmr">R</button></div>
    <div class="caixa sig"><b id="sig-val">4/4</b></div>
    <button class="chip" data-cmd="soloclick" data-flag="SOLO_CLICK">Solo Click</button>
    <button class="chip" data-cmd="loopclick" data-flag="REPETIR_CLICK">Loop Click</button>
    <button class="chip" data-cmd="pad" data-flag="PAD" id="bt-pad">PAD</button>
    <button class="chip" data-cmd="suave" data-flag="suave">Salto suave</button>
    <span id="saida-txt" class="status-txt"></span>
    <button type="button" id="bt-ver-compacto" class="chip">Ver compacto</button>
  </section>

  <section id="mixer">
    <div class="mix-titulos"><span>STEMS — BANDA</span><span>FONE / SAÍDA</span></div>
    <div id="mix-scroll"><div id="mix-stems"></div><div id="mix-direita"><div id="mix-dir"></div><div id="mix-master"></div></div></div>
  </section>
  <div id="mixer-ph" hidden></div>
  </div>

  <nav id="barra-compacta" aria-label="Transporte ao vivo">
    <button type="button" class="b3d rot" data-cmd="sprev" aria-label="Seção anterior"><svg viewBox="0 0 24 24"><path d="M11 6v12L3 12zM20 6v12l-8-6z"/></svg><span>SEÇÃO</span></button>
    <button type="button" id="bt-play-cp" class="play3d" data-cmd="play" title="Play / Pause" aria-label="Play ou pause"><svg class="i-play" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg><svg class="i-pause" viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg></button>
    <button type="button" class="b3d ic" data-cmd="stop" title="Stop" aria-label="Parar"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button type="button" class="b3d rot" data-cmd="snext" aria-label="Próxima seção"><svg viewBox="0 0 24 24"><path d="M13 6v12l8-6zM4 6v12l8-6z"/></svg><span>SEÇÃO</span></button>
  </nav>
  <footer id="rodape">Mik Seifador <span id="versao">1.9c</span> · Remoto · Criado por Miqueias Felix</footer>
</div>

<div id="conexao" hidden><div><b id="con-tit">Sem conexão com o REAPER</b><p id="con-txt"></p></div></div>
<div id="toast"></div>
<div id="veu" hidden></div>

<div id="sheet-extra" hidden>
  <div class="alca"></div>
  <div class="sheet-cab">
    <h3 id="sheet-tit">Setlist</h3>
    <button type="button" id="sheet-fechar">Fechar</button>
  </div>
  <div id="sheet-corpo"></div>
</div>
<div id="folha" hidden></div>

<script src="mikseifador/app.js?v=1.9c"></script>
</body>
